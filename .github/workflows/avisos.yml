# Toda manhã chama o Em Dia para ele conferir os vencimentos e mandar os avisos aos celulares.
# O site no plano grátis do Render dorme sem uso; este pedido também o acorda (pode levar ~1 min).
name: Avisos de vencimento

on:
  schedule:
    - cron: '30 11 * * *'   # 08:30 em Brasília (o GitHub às vezes atrasa alguns minutos)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions: {}

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir vencimentos
        run: |
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST https://em-dia-kei5.onrender.com/api/avisos/rodar
